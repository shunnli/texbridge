[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "texbridge"
version = "0.1.1"
description = "A small VS Code and SumatraPDF SyncTeX bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
texbridge = "texbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/texbridge"]
